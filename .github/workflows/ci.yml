  name: CI                                                                                                                                                                                            
                                                                                                                                                                                                      
  on:                                                                                                                                                                                                 
    push:                                                                                                                                                                                             
      branches: [main]
    pull_request:
      branches: [main]

  jobs:
    test:
      name: Analyze & Test
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: '3.41.2'
            channel: stable
            cache: true

        - name: Install dependencies
          run: flutter pub get

        - name: Generate Firebase options stub for CI
          run: |
            cat > lib/firebase_options.dart << 'EOF'
            // CI stub — not used at runtime.
            // ignore_for_file: lines_longer_than_80_chars
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart'
                show defaultTargetPlatform, kIsWeb, TargetPlatform;

            class DefaultFirebaseOptions {
              static FirebaseOptions get currentPlatform {
                if (kIsWeb) return web;
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  default:
                    throw UnsupportedError('Unsupported platform');
                }
              }

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: 'stub',
                appId: '1:000000000000:android:0000000000000000000000',
                messagingSenderId: '000000000000',
                projectId: 'stub-project',
                storageBucket: 'stub-project.appspot.com',
              );

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: 'stub',
                appId: '1:000000000000:web:0000000000000000000000',
                messagingSenderId: '000000000000',
                projectId: 'stub-project',
                storageBucket: 'stub-project.appspot.com',
                authDomain: 'stub-project.firebaseapp.com',
              );
            }
            EOF

        - name: Analyze
          run: flutter analyze --fatal-infos

        - name: Run unit & widget tests
          run: flutter test --coverage

        - name: Upload coverage report
          uses: actions/upload-artifact@v4
          with:
            name: coverage
            path: coverage/lcov.info
            retention-days: 7

    backoffice:
      name: Backoffice TypeCheck
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: web_backoffice/package-lock.json

        - name: Install dependencies
          working-directory: web_backoffice
          run: npm ci

        - name: TypeScript type-check
          working-directory: web_backoffice
          run: npm run typecheck

        - name: Lint
          working-directory: web_backoffice
          run: npm run lint

        - name: Unit tests
          working-directory: web_backoffice
          run: npm test

    edge-functions:
      name: Edge Functions TypeCheck
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up Deno
          uses: denoland/setup-deno@v2
          with:
            deno-version: v2.x

        - name: Type-check Edge Functions
          run: deno check supabase/functions/**/*.ts

